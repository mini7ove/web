<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbybZJ6Qx9DBVkRvg9Li22e6nRq-lGX_Reoxl7075_CwBDPNW4ZcoMedg5lvFV2vOnRC/exec';
const VOTE_KEY='vote-helper-2026-'+API.split('/').at(-2);
const $=id=>document.getElementById(id); let options=[], busy=false, choice=null, storageOK=true, voted='';
try{voted=localStorage.getItem(VOTE_KEY)||'';localStorage.setItem(VOTE_KEY+'-probe','1');localStorage.removeItem(VOTE_KEY+'-probe')}catch(e){storageOK=false}
function status(id,msg,type=''){const el=$(id);el.textContent=msg;el.className='status '+type}
function setBusy(value){busy=value;$('refresh').disabled=value;$('addBtn').disabled=value;$('confirmVote').disabled=value;document.querySelectorAll('.votebtn').forEach(x=>x.disabled=value||Boolean(voted)||!storageOK)}
async function request(action,payload){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);try{const opts=action==='read'?{cache:'no-store',signal:controller.signal}:{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...payload}),signal:controller.signal};const r=await fetch(API,opts);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.success)throw new Error(data.message||'試算表回傳錯誤');return data}finally{clearTimeout(timer)}}
function addText(parent,tag,cls,text){let n=document.createElement(tag);n.className=cls;n.textContent=text;parent.appendChild(n);return n}
function render(){const root=$('cards');root.replaceChildren();const q=$('search').value.trim().toLowerCase();const rows=options.filter(x=>(String(x.title)+' '+String(x.stats)).toLowerCase().includes(q));$('count').textContent=options.length+' 個稱號';$('summary').textContent=voted?'♡ 這個瀏覽器已投票：'+voted:storageOK?'每個瀏覽器可投一票':'此瀏覽器無法儲存投票紀錄，請開啟瀏覽器儲存功能。';if(!rows.length){const box=document.createElement('div');box.className='empty';addText(box,'b','',q?'找不到符合的稱號':'還沒有稱號唷');addText(box,'span','',q?'換個關鍵字試試看！':'來新增第一個稱號吧 ♥');root.append(box);return}rows.forEach((row,i)=>{let box=document.createElement('article');box.className='choice';addText(box,'div','rank',String(row.serial||i+1));let text=document.createElement('div');addText(text,'div','choice-name',row.title);addText(text,'div','stats',row.stats);box.append(text);let right=document.createElement('div');right.className='choice-right';let total=addText(right,'div','vote-total',String(Number(row.votes)||0));addText(total,'small','','票');let b=addText(right,'button','btn soft votebtn','♡ 投一票');b.type='button';b.disabled=busy||Boolean(voted)||!storageOK;b.addEventListener('click',()=>{choice=row.title;$('confirmTitle').textContent=choice;$('confirmDialog').showModal()});box.append(right);root.append(box)})}
async function load(){setBusy(true);status('listStatus','正在讀取試算表...');try{let data=await request('read');if(!Array.isArray(data.options))throw new Error('資料格式不正確');options=data.options;render();status('listStatus','✿ 已新增的稱號','success')}catch(e){status('listStatus','讀取失敗，請確認網路與 Apps Script 部署權限，再按重新整理。','error');if(!options.length){$('cards').replaceChildren();$('count').textContent='讀取失敗'}}finally{setBusy(false)}}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const title=$('title').value.trim(),stats=$('stats').value.trim();if(!title||!stats){status('addStatus','請填寫稱號和素質。','error');return}setBusy(true);status('addStatus','正在新增...');try{await request('add',{title,stats});$('addForm').reset();status('addStatus','新增成功！已加入稱號清單 ♡','success');await load()}catch(err){let unknown=err.name==='AbortError'||err instanceof TypeError;status('addStatus',unknown?'無法確認是否新增成功，請先重新整理清單再重試。':err.message,'error')}finally{setBusy(false)}});
$('confirmVote').addEventListener('click',async()=>{if(busy||voted||!storageOK||!choice)return;let title=choice;$('confirmDialog').close();setBusy(true);status('listStatus','正在送出投票...');try{await request('vote',{title});voted=title;try{localStorage.setItem(VOTE_KEY,title)}catch(e){storageOK=false}render();status('listStatus',storageOK?'投票成功，謝謝你的參與！':'投票成功，但瀏覽器無法保存投票狀態。','success');await load()}catch(err){let unknown=err.name==='AbortError'||err instanceof TypeError;status('listStatus',unknown?'無法確認是否投票成功，請先查看票數或請管理員確認，避免重複送出。':err.message,'error')}finally{setBusy(false)}});
$('cancelVote').addEventListener('click',()=>$('confirmDialog').close());$('refresh').addEventListener('click',load);$('search').addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$(b.dataset.target).scrollIntoView({behavior:'smooth',block:'start'});if(b.dataset.target==='addPanel')$('title').focus({preventScroll:true})}));load();
</script></body></html>
